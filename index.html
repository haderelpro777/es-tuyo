<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Interactivo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f0f13;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* === FOTOS FLOTANTES DE FONDO (+15% de tamaño) === */
    .bg-floating-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .floating-photo {
      position: absolute;
      /* Tamaño incrementado un 15% (de 120px a ~138px / de 160px a ~184px) */
      width: 138px;
      height: 138px;
      object-fit: cover;
      border-radius: 15px;
      opacity: 0.25;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      animation: floatAnimation 12s infinite ease-in-out;
    }

    /* Posicionamiento y variación de las imágenes flotantes */
    .photo-1 { top: 10%; left: 8%; animation-delay: 0s; }
    .photo-2 { top: 65%; left: 12%; width: 184px; height: 184px; animation-delay: 3s; }
    .photo-3 { top: 15%; right: 10%; width: 160px; height: 160px; animation-delay: 1.5s; }
    .photo-4 { top: 70%; right: 8%; animation-delay: 4.5s; }

    @keyframes floatAnimation {
      0%, 100% {
        transform: translateY(0) rotate(0deg) scale(1.15); /* Aplicado +15% de escala */
      }
      50% {
        transform: translateY(-25px) rotate(4deg) scale(1.15);
      }
    }

    /* === CONTENIDO PRINCIPAL === */
    .main-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #fff;
    }

    p {
      font-size: 1rem;
      color: #cccccc;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* === BOTÓN Y CONTROL DE AUDIO === */
    .btn-music {
      background: linear-gradient(135deg, #ff0055, #7a00ff);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-music:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(255, 0, 85, 0.4);
    }

    .track-info {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Fotos Flotantes en el Fondo -->
  <div class="bg-floating-container">
    <img src="foto1.jpg" alt="Fondo 1" class="floating-photo photo-1">
    <img src="foto2.jpg" alt="Fondo 2" class="floating-photo photo-2">
    <img src="foto3.jpg" alt="Fondo 3" class="floating-photo photo-3">
    <img src="foto4.jpg" alt="Fondo 4" class="floating-photo photo-4">
  </div>

  <!-- Contenido Central -->
  <div class="main-container">
    <div class="card">
      <h1>Polos Opuestos</h1>
      <p>Haz clic abajo para reproducir la música de fondo mientras navegas.</p>
      
      <button class="btn-music" id="musicToggle">
        <span id="btnIcon">▶</span> <span id="btnText">Reproducir Música</span>
      </button>

      <div class="track-info">🎵 Sonando: Blessd, Kris R - Polos Opuestos</div>
    </div>
  </div>

  <!-- Audio de Fondo -->
  <audio id="bgMusic" loop preload="auto">
    <source src="polos-opuestos.mp3" type="audio/mpeg">
    Tu navegador no soporta el elemento de audio.
  </audio>

  <script>
    const audio = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicToggle');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');

    musicBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        btnIcon.textContent = '❚❚';
        btnText.textContent = 'Pausar Música';
      } else {
        audio.pause();
        btnIcon.textContent = '▶';
        btnText.textContent = 'Reproducir Música';
      }
    });
  </script>
</body>
</html>
